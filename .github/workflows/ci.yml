name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  validate:
    name: Lint, type-check, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Build application
        run: npm run build

      # Playwright smoke/e2e tests are intentionally left commented out for now.
      # When your test suite is ready, you can enable either approach below.
