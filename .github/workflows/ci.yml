name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  validate:
    name: Lint, type-check, and build
    runs-on: ubuntu-latest
    env:
      # ใช้ vars. หรือ secrets. ให้ตรงกับที่ตั้งไว้ใน GitHub Settings
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || secrets.NEXT_PUBLIC_APP_URL }}
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL || vars.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD || vars.SMOKE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Build application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application
        run: |
          npm run start > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for application
        run: npx wait-on http://127.0.0.1:3000 --timeout 60000 || (cat app.log && exit 1)

      - name: Run login smoke test
        run: npx playwright test tests/smoke.spec.ts

      - name: Stop application
        if: always()
        run: |
          if [ -f app.pid ]; then kill $(cat app.pid) || true; fi