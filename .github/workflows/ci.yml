name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  validate:
    name: Lint, type-check, and build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Build application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application
        run: |
          npm run start > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for application
        run: npx wait-on http://127.0.0.1:3000 --timeout 60000 || (cat app.log && exit 1)

      - name: Run login smoke test
        env:
          BASE_URL: http://127.0.0.1:3000
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL || 'adminpreaw@gmail.com' }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD || 'test1150' }}
        run: npx playwright test tests/smoke.spec.ts

      - name: Stop application
        if: always()
        run: |
          if [ -f app.pid ]; then kill $(cat app.pid) || true; fi

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7